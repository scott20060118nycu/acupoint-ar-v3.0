<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>穴位計算-手機影像端</title>
  
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
    }

    /* 視訊與 Canvas 區域 */
    .view-container {
      width: 100vw; height: 100vh;
      position: relative; background-color: #000;
    }

    /* 解決手機黑屏關鍵：不可使用 display: none，改用背景隱藏 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    canvas {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 頂部狀態列 */
    #status_bar {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px; border-radius: 20px;
      background: rgba(0,0,0,0.85); color: #00FFCC;
      font-size: 13px; font-weight: bold;
      backdrop-filter: blur(8px); z-index: 10;
      border: 1px solid rgba(0, 255, 204, 0.3);
      text-align: center; white-space: nowrap;
    }

    /* 模式切換按鈕 */
    #btn_switch_mode {
      position: absolute; bottom: 24px; right: 20px;
      padding: 10px 18px; border-radius: 20px;
      background: rgba(30, 30, 30, 0.85); color: #FFF;
      font-size: 14px; font-weight: bold; border: 1px solid #555;
      backdrop-filter: blur(8px); z-index: 10; cursor: pointer;
      display: none;
    }

    /* 模式選擇彈窗 Modal */
    .modal-overlay {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; z-index: 100;
    }
    .modal-title {
      font-size: 22px; font-weight: bold; color: #00FFCC;
      margin-bottom: 6px; text-align: center;
    }
    .modal-subtitle {
      font-size: 13px; color: #AAA; margin-bottom: 24px;
      text-align: center;
    }
    .option-card {
      width: 100%; max-width: 320px;
      background: #1e1e1e; border: 1px solid #333;
      border-radius: 16px; padding: 18px; margin-bottom: 16px;
      cursor: pointer; transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .option-card:active {
      transform: scale(0.98);
      background: #2a2a2a; border-color: #00FFCC;
    }
    .option-header {
      font-size: 16px; font-weight: bold; color: #FFF;
      text-align: center;
    }

    /* 掃碼對焦框 */
    #scanner_overlay {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; pointer-events: none;
    }
    .scan-box {
      width: 220px; height: 220px;
      border: 3px solid #00FFCC; border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .scan-tip {
      color: #FFF; margin-top: 24px; font-size: 14px;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- 頂部狀態資訊 -->
  <div id="status_bar">請選擇 App 運作模式</div>

  <!-- 主畫面區域 -->
  <div class="view-container">
    <video id="local_video" playsinline autoplay muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <!-- 掃碼對焦框 UI -->
  <div id="scanner_overlay">
    <div class="scan-box"></div>
    <div class="scan-tip">請將手機對準電腦螢幕上的 QR Code</div>
  </div>

  <!-- 切換模式按鈕 -->
  <button id="btn_switch_mode">切換模式</button>

  <!-- 模式選擇 Modal -->
  <div id="mode_modal" class="modal-overlay">
    <div class="modal-title">穴位計算 - 手機 App</div>
    <div class="modal-subtitle">請選擇您要使用的方式：</div>

    <div class="option-card" id="opt_mode1">
      <div class="option-header">模式一：手機端顯示</div>
    </div>

    <div class="option-card" id="opt_mode2">
      <div class="option-header">模式二：傳送給電腦顯示</div>
    </div>
  </div>

  <script>
    const statusBar = document.getElementById('status_bar');
    const localVideo = document.getElementById('local_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const modeModal = document.getElementById('mode_modal');
    const scannerOverlay = document.getElementById('scanner_overlay');
    const btnSwitchMode = document.getElementById('btn_switch_mode');

    // 建立輕量專用 Canvas 供高效能 QR 掃描使用
    const scanCanvas = document.createElement('canvas');
    const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    scanCanvas.width = 320;
    scanCanvas.height = 320;

    const urlParams = new URLSearchParams(window.location.search);
    let targetRoomId = urlParams.get('room');

    let currentMode = null;
    let mediaStream = null;
    let peerInstance = null;
    let dataConn = null;
    let faceMeshInstance = null;
    let isProcessingMode1 = false;
    let scanAnimationId = null;
    let lastScanTime = 0;

    function resizeCanvas() {
      canvasElement.width = canvasElement.clientWidth * (window.devicePixelRatio || 1);
      canvasElement.height = canvasElement.clientHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function stopAllProcesses() {
      if (scanAnimationId) {
        cancelAnimationFrame(scanAnimationId);
        scanAnimationId = null;
      }

      // 通知電腦端停止串流並清空畫面
      if (dataConn && dataConn.open) {
        try {
          dataConn.send({ type: 'STOP_STREAM' });
        } catch (e) {
          console.warn("無法發送 STOP_STREAM 訊號", e);
        }
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (peerInstance) {
        peerInstance.destroy();
        peerInstance = null;
      }
      dataConn = null;

      isProcessingMode1 = false;
      scannerOverlay.style.display = 'none';
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    }

    // 啟動相機並確保畫面解碼與播放
    async function startCamera(facingMode = 'user') {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false
        });
      } catch (err) {
        console.warn("無法取得指定鏡頭，退回通用設定", err);
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });
      }

      localVideo.srcObject = mediaStream;

      try {
        await localVideo.play();
      } catch (e) {
        console.warn("Video play error:", e);
      }

      await new Promise((resolve) => {
        if (localVideo.videoWidth > 0) {
          resolve();
        } else {
          localVideo.onloadedmetadata = () => resolve();
        }
      });

      return mediaStream;
    }

    // 畫面的通用縮放繪製函數
    function drawVideoToCanvas(video, canvas, ctx, mirror = false) {
      const cw = canvas.width, ch = canvas.height;
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;

      const canvasAspect = cw / ch;
      const imgAspect = vw / vh;
      let renderW, renderH, offsetX, offsetY;

      if (imgAspect > canvasAspect) {
        renderH = ch; renderW = vw * (ch / vh);
        offsetX = (cw - renderW) / 2; offsetY = 0;
      } else {
        renderW = cw; renderH = vh * (cw / vw);
        offsetX = 0; offsetY = (ch - renderH) / 2;
      }

      ctx.save();
      ctx.clearRect(0, 0, cw, ch);

      if (mirror) {
        ctx.translate(cw, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, cw - offsetX - renderW, offsetY, renderW, renderH);
      } else {
        ctx.drawImage(video, offsetX, offsetY, renderW, renderH);
      }

      ctx.restore();
      return { renderW, renderH, offsetX, offsetY };
    }

    // --- 模式一：手機端顯示 ---
    let smoothedLandmarks = null;
    function applyFullMeshSmoothing(rawLandmarks) {
      if (!smoothedLandmarks || smoothedLandmarks.length !== rawLandmarks.length) {
        smoothedLandmarks = rawLandmarks.map(pt => ({ x: pt.x, y: pt.y, z: pt.z }));
        return smoothedLandmarks;
      }
      const alphaMin = 0.05, alphaMax = 0.88, k = 140;
      for (let i = 0; i < rawLandmarks.length; i++) {
        const raw = rawLandmarks[i], prev = smoothedLandmarks[i];
        const dx = raw.x - prev.x, dy = raw.y - prev.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dynamicAlpha = alphaMin + (alphaMax - alphaMin) * Math.exp(-k * dist);
        prev.x = dynamicAlpha * prev.x + (1 - dynamicAlpha) * raw.x;
        prev.y = dynamicAlpha * prev.y + (1 - dynamicAlpha) * raw.y;
        if (raw.z !== undefined && prev.z !== undefined) {
          prev.z = dynamicAlpha * prev.z + (1 - dynamicAlpha) * raw.z;
        }
      }
      return smoothedLandmarks;
    }

    async function startMode1() {
      currentMode = 'MODE_1';
      stopAllProcesses();
      statusBar.textContent = "手機 AI 辨識中...";

      try {
        await startCamera('user');

        if (!faceMeshInstance) {
          faceMeshInstance = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
          });
          faceMeshInstance.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.9, minTrackingConfidence: 0.9 });
          faceMeshInstance.onResults(onResultsMode1);
        }

        isProcessingMode1 = true;
        requestAnimationFrame(processFrameMode1);

      } catch (err) {
        console.error("模式一相機開啟失敗:", err);
        statusBar.textContent = "無法開啟相機，請檢查權限";
      }
    }

    async function processFrameMode1() {
      if (currentMode === 'MODE_1' && isProcessingMode1 && localVideo.readyState >= 2) {
        await faceMeshInstance.send({ image: localVideo });
        requestAnimationFrame(processFrameMode1);
      }
    }

    function onResultsMode1(results) {
      if (currentMode !== 'MODE_1') return;
      const cw = canvasElement.width, ch = canvasElement.height;
      const dpr = window.devicePixelRatio || 1;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, cw, ch);

      if (!results.image) { canvasCtx.restore(); return; }

      const vw = results.image.width, vh = results.image.height;
      const canvasAspect = cw / ch, imgAspect = vw / vh;
      let renderW, renderH, offsetX, offsetY;

      if (imgAspect > canvasAspect) {
        renderH = ch; renderW = vw * (ch / vh);
        offsetX = (cw - renderW) / 2; offsetY = 0;
      } else {
        renderW = cw; renderH = vh * (cw / vw);
        offsetX = 0; offsetY = (ch - renderH) / 2;
      }

      // 水平鏡像翻轉繪製
      canvasCtx.translate(cw, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, cw - offsetX - renderW, offsetY, renderW, renderH);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = applyFullMeshSmoothing(results.multiFaceLandmarks[0]);
          
        // 繪製 3D FaceMesh 網格
        canvasCtx.save();
        canvasCtx.translate(cw - offsetX - renderW, offsetY);
        canvasCtx.scale(renderW / cw, renderH / ch);
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C060', lineWidth: 1.8 * dpr});
        drawConnectors(canvasCtx, landmarks, FACEMESH_CONTOURS, {color: '#00FFCCB0', lineWidth: 3.5 * dpr});
        canvasCtx.restore();

        const getPt = (idx) => ({
          x: offsetX + landmarks[idx].x * renderW,
          y: offsetY + landmarks[idx].y * renderH
        });

        // 取得鼻尖、瞳孔與眼睛關鍵點
        const nose = getPt(1);
        const leftPupil = landmarks[468] ? getPt(468) : getPt(145);
        const rightPupil = landmarks[473] ? getPt(473) : getPt(374);
        const leftInnerCanthus = getPt(133);
        const rightInnerCanthus = getPt(362);
        const leftOuterCanthus = getPt(33);
        const rightOuterCanthus = getPt(263);

        // 🔍 轉頭遮蔽判定
        const distL = Math.hypot(leftOuterCanthus.x - nose.x, leftOuterCanthus.y - nose.y);
        const distR = Math.hypot(rightOuterCanthus.x - nose.x, rightOuterCanthus.y - nose.y);
        const totalDist = distL + distR || 1;

        const ratioL = distL / totalDist;
        const ratioR = distR / totalDist;

        const showLeft = ratioL >= 0.32;
        const showRight = ratioR >= 0.32;

        // 📐 中醫同身寸動態校正演算法
        const ipdDistance = Math.hypot(rightPupil.x - leftPupil.x, rightPupil.y - leftPupil.y);
        const innerCanthusDistance = Math.hypot(rightInnerCanthus.x - leftInnerCanthus.x, rightInnerCanthus.y - leftInnerCanthus.y);
        const cunInPixels = ((ipdDistance / 3.0) + innerCanthusDistance) / 2.0;

        // 面部姿態自適應單位向量
        const dx = rightPupil.x - leftPupil.x;
        const dy = rightPupil.y - leftPupil.y;
        const len = Math.hypot(dx, dy) || 1;
        const uH = { x: dx / len, y: dy / len };
        const uV = { x: -uH.y, y: uH.x };

        const offsetByCun = (anchor, hCun, vCun) => ({
          x: Math.round(anchor.x + (hCun * uH.x + vCun * uV.x) * cunInPixels),
          y: Math.round(anchor.y + (hCun * uH.y + vCun * uV.y) * cunInPixels)
        });

        // 精準計算穴位座標
        const yintang = {
          x: Math.round((getPt(55).x + getPt(285).x) / 2),
          y: Math.round((getPt(55).y + getPt(285).y) / 2)
        };
        const qingming_L = offsetByCun(leftInnerCanthus, -0.1, -0.1);
        const qingming_R = offsetByCun(rightInnerCanthus, 0.1, -0.1);
        const zanzhu_L = { x: Math.round(getPt(55).x), y: Math.round(getPt(55).y) };
        const zanzhu_R = { x: Math.round(getPt(285).x), y: Math.round(getPt(285).y) };
        const yuyao_L = { x: Math.round(getPt(105).x), y: Math.round(getPt(105).y) };
        const yuyao_R = { x: Math.round(getPt(334).x), y: Math.round(getPt(334).y) };
        const tongzi_L = offsetByCun(leftOuterCanthus, -0.5, 0);
        const tongzi_R = offsetByCun(rightOuterCanthus, 0.5, 0);
        const sibai_L = offsetByCun(leftPupil, 0, 1.0);
        const sibai_R = offsetByCun(rightPupil, 0, 1.0);

        // 🌟 新增穴位：迎香、地倉、承漿
        const yingxiang_L = getPt(102);
        const yingxiang_R = getPt(331);
        const dicang_L = offsetByCun(getPt(61), -0.4, 0);
        const dicang_R = offsetByCun(getPt(291), 0.4, 0);
        const chengjiang = getPt(18);

        // 標籤繪製函數
        const drawPoint = (label, pt) => {
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 14 * dpr, 0, 2 * Math.PI);
          canvasCtx.fillStyle = 'rgba(255, 0, 85, 0.35)';
          canvasCtx.fill();

          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 6.5 * dpr, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#FF0055';
          canvasCtx.fill();

          canvasCtx.lineWidth = 2.5 * dpr;
          canvasCtx.strokeStyle = '#FFFFFF';
          canvasCtx.stroke();

          canvasCtx.save();
          canvasCtx.translate(pt.x, pt.y);
          canvasCtx.scale(-1, 1);

          const fontSize = Math.round(14 * dpr);
          canvasCtx.font = `bold ${fontSize}px Arial, sans-serif`;
          const textWidth = canvasCtx.measureText(label).width;
          const paddingX = 8 * dpr, paddingY = 5 * dpr, offsetY = 14 * dpr;

          canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          canvasCtx.beginPath();
          canvasCtx.roundRect(-textWidth / 2 - paddingX, -fontSize - offsetY - (paddingY / 2), textWidth + (paddingX * 2), fontSize + paddingY, 5 * dpr);
          canvasCtx.fill();

          canvasCtx.fillStyle = '#00FFCC';
          canvasCtx.textAlign = 'center';
          canvasCtx.fillText(label, 0, -offsetY);
          canvasCtx.restore();
        };

        // 中線穴位繪製
        if (ratioL >= 0.22 && ratioR >= 0.22) {
          drawPoint("Yintang", yintang);
          drawPoint("Chengjiang", chengjiang);
        }

        // 左側穴位繪製
        if (showLeft) {
          drawPoint("Qingming_L", qingming_L);
          drawPoint("Zanzhu_L", zanzhu_L);
          drawPoint("Yuyao_L", yuyao_L);
          drawPoint("Tongziliao_L", tongzi_L);
          drawPoint("Sibai_L", sibai_L);
          drawPoint("Yingxiang_L", yingxiang_L);
          drawPoint("Dicang_L", dicang_L);
        }

        // 右側穴位繪製
        if (showRight) {
          drawPoint("Qingming_R", qingming_R);
          drawPoint("Zanzhu_R", zanzhu_R);
          drawPoint("Yuyao_R", yuyao_R);
          drawPoint("Tongziliao_R", tongzi_R);
          drawPoint("Sibai_R", sibai_R);
          drawPoint("Yingxiang_R", yingxiang_R);
          drawPoint("Dicang_R", dicang_R);
        }

      } else {
        smoothedLandmarks = null;
      }
      canvasCtx.restore();
    }

    // --- 模式二：掃描 QR Code ---
    async function startMode2Scan() {
      currentMode = 'MODE_2_SCAN';
      stopAllProcesses();
      statusBar.textContent = "請掃描電腦上的 QR Code...";
      scannerOverlay.style.display = 'flex';

      try {
        await startCamera('environment');
        lastScanTime = 0;
        scanQRCodeFrame(performance.now());
      } catch (err) {
        console.error("無法開啟後鏡頭:", err);
        statusBar.textContent = "無法開啟後鏡頭掃描";
      }
    }

    function scanQRCodeFrame(timestamp) {
      if (currentMode !== 'MODE_2_SCAN') return;

      if (localVideo.readyState >= 2 && localVideo.videoWidth > 0) {
        drawVideoToCanvas(localVideo, canvasElement, canvasCtx, false);

        if (timestamp - lastScanTime > 150) {
          lastScanTime = timestamp;

          scanCtx.drawImage(localVideo, 0, 0, scanCanvas.width, scanCanvas.height);
          const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
          const code = jsQR(imageData.data, scanCanvas.width, scanCanvas.height, {
            inversionAttempts: "dontInvert"
          });

          if (code && code.data) {
            try {
              const scannedUrl = new URL(code.data);
              const roomId = scannedUrl.searchParams.get('room');
              if (roomId) {
                targetRoomId = roomId;
                statusBar.textContent = `成功配對房號：${targetRoomId}`;
                startMode2Stream();
                return;
              }
            } catch (e) {
              console.warn("非有效 URL", code.data);
            }
          }
        }
      }
      scanAnimationId = requestAnimationFrame(scanQRCodeFrame);
    }

    // --- 模式二：串流至電腦 ---
    async function startMode2Stream() {
      currentMode = 'MODE_2_STREAM';
      stopAllProcesses();

      if (!targetRoomId) {
        startMode2Scan();
        return;
      }

      try {
        statusBar.textContent = "正在連線至電腦主控台...";
        const stream = await startCamera('user');

        drawSimplePreview();

        peerInstance = new Peer();

        peerInstance.on('open', () => {
          dataConn = peerInstance.connect(targetRoomId);

          dataConn.on('open', () => {
            statusBar.textContent = `已連線電腦 (${targetRoomId})`;
          });

          dataConn.on('data', (data) => {
            if (data.type === 'RESTART_STREAM') {
              statusBar.textContent = "接收到電腦要求，重新連線...";
              window.location.reload();
            }
          });

          peerInstance.call(targetRoomId, stream);
        });

        peerInstance.on('error', (err) => {
          console.error("PeerJS 錯誤:", err);
          statusBar.textContent = "連線失敗，請嘗試刷新";
        });

      } catch (err) {
        console.error("模式二串流失敗:", err);
        statusBar.textContent = "前鏡頭開啟失敗";
      }
    }

    function drawSimplePreview() {
      if (currentMode !== 'MODE_2_STREAM') return;

      if (localVideo.readyState >= 2 && localVideo.videoWidth > 0) {
        drawVideoToCanvas(localVideo, canvasElement, canvasCtx, true);
      }

      if (currentMode === 'MODE_2_STREAM') {
        requestAnimationFrame(drawSimplePreview);
      }
    }

    // 初始化邏輯
    if (targetRoomId) {
      modeModal.style.display = 'none';
      btnSwitchMode.style.display = 'block';
      startMode2Stream();
    } else {
      modeModal.style.display = 'flex';
      btnSwitchMode.style.display = 'none';
    }

    // UI 事件
    document.getElementById('opt_mode1').addEventListener('click', () => {
      modeModal.style.display = 'none';
      btnSwitchMode.style.display = 'block';
      startMode1();
    });

    document.getElementById('opt_mode2').addEventListener('click', () => {
      modeModal.style.display = 'none';
      btnSwitchMode.style.display = 'block';
      startMode2Scan();
    });

    btnSwitchMode.addEventListener('click', () => {
      stopAllProcesses();
      btnSwitchMode.style.display = 'none';
      modeModal.style.display = 'flex';
      statusBar.textContent = "請選擇 App 運作模式";
    });
  </script>
</body>
</html>
